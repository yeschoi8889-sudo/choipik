<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>최고집 선택표</title>
<style>
:root{--rose:#D9487A;--rose-t:#FBE6EE;--plum:#3A1C33;--plum-t:#EEE8F2;--lav:#8E7CC3;--bg:#F6F4F7;--ink:#1a1a1a;--mute:#5c5460;--line:#E4DEE3;--green:#1E7F4C;--green-t:#E3F3EA;--amber:#B26A00;--amber-t:#FFF3DC;--red:#D32F2F;
--r1:#D9487A;--r2:#6B4A8C;--r3:#8A8290}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif;line-height:1.4;word-break:keep-all;overflow-wrap:break-word;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
input,textarea{font-size:max(16px,1rem);min-width:0;width:100%;border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;background:#fff}
button{cursor:pointer;border:0;border-radius:12px;padding:.7rem 1rem;font-weight:700;background:var(--plum);color:#fff;min-height:3rem}
button.sub{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.rose{background:var(--rose)}
button.sm{min-height:2.2rem;padding:.3rem .7rem;font-size:.85rem;font-weight:600}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{font-size:1.35rem}
.kicker{color:var(--rose);font-weight:800;font-size:.85rem}
.muted{color:var(--mute);font-size:.88rem}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px #0000000d}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.badge{display:inline-block;border-radius:999px;padding:.2rem .6rem;font-size:.78rem;font-weight:800}
.b-new{background:var(--red);color:#fff}.b-done{background:var(--green-t);color:var(--green)}.b-wait{background:var(--amber-t);color:var(--amber)}.b-edit{background:var(--plum-t);color:var(--plum)}
.prog{height:10px;border-radius:99px;background:var(--plum-t);overflow:hidden;margin:8px 0 6px}.prog i{display:block;height:100%;background:var(--green);border-radius:99px}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:#fff;border-radius:14px;padding:5px;margin-bottom:14px}
.tabs button{background:none;color:var(--mute);min-height:2.6rem}.tabs button.on{background:var(--plum);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}.bar .in>button{flex:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:12px;z-index:9;max-width:90vw;text-align:center}
.ov{position:fixed;inset:0;background:#0007;z-index:8;display:grid;place-items:center;padding:16px}.ov .card{width:100%;max-width:440px}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.95rem}
.ihead{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.ihead .t{font-weight:800;font-size:1.2rem;flex:1}
/* 항목마다 다른 색 제목 띠 (고객이 '지금 무엇을 고르는지' 바로 보이게) */
.card.ic{border:3px solid var(--ic);padding-top:0;overflow:hidden}
.ib{background:var(--ic);color:#fff;margin:0 -16px 14px;padding:14px 16px;display:flex;align-items:center;gap:10px}
.ib .num{background:#fff;color:var(--ic);width:34px;height:34px;font-size:1rem}
.ib .t{font-size:1.45rem;font-weight:900;flex:1;letter-spacing:-.01em}
.ib .st{font-size:.85rem;font-weight:800;background:#ffffff33;border-radius:999px;padding:.2rem .65rem;white-space:nowrap}
.ib.done .st{background:#fff;color:var(--ic)}
.tagc{display:inline-block;background:var(--ic);color:#fff;border-radius:8px;padding:.1rem .55rem;font-size:.82rem;font-weight:800;margin-bottom:2px}
.rk{display:inline-block;border-radius:8px;padding:.15rem .5rem;font-size:.78rem;font-weight:800;color:#fff}
.rk1{background:var(--r1)}.rk2{background:var(--r2)}.rk3{background:var(--r3)}
/* ── 대표: 준비 ── */
.drop{border:2px dashed #cfc4d4;border-radius:14px;padding:16px;text-align:center;color:var(--mute);background:var(--bg);cursor:pointer;margin-bottom:10px}
.drop b{display:block;color:var(--plum);font-size:1.05rem}
.drop.over{border-color:var(--rose);background:var(--rose-t)}
.eopt{position:relative;border:2px solid var(--line);border-radius:14px;padding:8px;display:grid;gap:6px;background:#fff;align-content:start}
.eopt.r1{border-color:var(--r1)}.eopt.r2{border-color:var(--r2)}.eopt.r3{border-color:var(--r3)}
.eopt .img{aspect-ratio:4/3;border-radius:10px;background:#f3f1f5 center/contain no-repeat;cursor:pointer}
.inst{border:2px dashed #cfc4d4;border-radius:10px;padding:.45rem;text-align:center;font-size:.8rem;color:var(--mute);cursor:pointer;background:var(--bg) center/cover no-repeat}
.inst.has{border:0;aspect-ratio:4/3;color:#fff;display:flex;align-items:flex-end;justify-content:flex-start;padding:4px}
.inst.has span{background:#000a;border-radius:6px;padding:.1rem .4rem}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.seg button{min-height:2.4rem;padding:0;font-size:.85rem;background:var(--bg);color:var(--mute);border:1px solid var(--line);border-radius:9px}
.seg button.on1{background:var(--r1);color:#fff;border-color:var(--r1)}.seg button.on2{background:var(--r2);color:#fff;border-color:var(--r2)}.seg button.on3{background:var(--r3);color:#fff;border-color:var(--r3)}
.why{background:var(--amber-t);border-color:#f0d9a4}
.row2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:6px}
.del{position:absolute;top:-10px;right:-8px;width:28px;height:28px;min-height:0;padding:0;border-radius:50%;background:#fff;color:var(--mute);border:1px solid var(--line)}
.irow{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
/* ── 고객 ── */
.c-head{background:var(--plum);color:#fff;border-radius:18px;padding:20px 18px;margin-bottom:12px}
.c-head .kicker{color:#F7B6CC}.c-head h1{font-size:1.45rem;margin:4px 0}
.c-head .prog{background:#ffffff33}.c-head .prog i{background:#7CE0A8}
.copt{position:relative;border:3px solid transparent;border-radius:16px;background:#fff;cursor:pointer;overflow:hidden;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column}
.copt.on{border-color:var(--green);box-shadow:0 0 0 3px #1E7F4C33}
.copt .img{aspect-ratio:4/3;background:#f3f1f5 center/contain no-repeat;position:relative}
.copt .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px}.copt .pair .img{aspect-ratio:1/1}
.cap{position:absolute;left:6px;bottom:6px;background:#000a;color:#fff;font-size:.72rem;font-weight:700;border-radius:6px;padding:.1rem .4rem}
.inset{position:absolute;right:6px;bottom:6px;width:42%;aspect-ratio:1;border-radius:8px;border:2px solid #fff;background:#fff center/contain no-repeat;box-shadow:0 2px 6px #0004}
.copt.big .img{aspect-ratio:16/10}
.copt .body{padding:10px 12px 12px;display:grid;gap:4px}
.copt .nm{font-weight:800}.copt .pr{font-weight:800;color:var(--rose)}
.copt .ribbon{position:absolute;top:10px;left:10px;border-radius:10px;padding:.3rem .65rem;font-weight:800;color:#fff;font-size:.85rem;box-shadow:0 2px 6px #0003}
.copt.big .ribbon{font-size:1rem}
.copt.noimg .body{padding-top:48px}.copt.noimg .nm{font-size:1.05rem}
.copt:not(.big) .ribbon{font-size:.75rem;padding:.2rem .5rem;top:8px;left:8px}
.copt .check{order:3;margin:0 10px 10px;text-align:center;border-radius:10px;background:var(--bg);border:2px solid var(--line);padding:.55rem;font-weight:800;color:var(--mute)}
.copt.on .check{background:var(--green);border-color:var(--green);color:#fff}
.say{display:flex;gap:8px;align-items:flex-start;background:var(--amber-t);border-radius:12px;padding:8px 10px;font-size:.92rem}
.say .who{flex:none;width:26px;height:26px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-size:.7rem;font-weight:800}
.stack{display:grid;gap:10px}
.copt:not(.big) .say{padding:6px 8px;font-size:.85rem}.copt:not(.big) .say .who{display:none}
.qa{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:6px}
.bub{max-width:85%;border-radius:14px;padding:.5rem .75rem;font-size:.93rem}
.bub small{display:block;font-size:.72rem;opacity:.7}
.bub.c{justify-self:end;background:var(--plum);color:#fff;border-bottom-right-radius:4px}
.bub.d{justify-self:start;background:var(--rose-t);border-bottom-left-radius:4px}
.ask{display:flex;gap:6px}.ask input{flex:1}.ask button{flex:none;min-height:2.7rem}
.done-b{background:var(--green-t);color:var(--green);border-radius:14px;padding:12px;text-align:center;font-weight:700;margin-bottom:12px}
/* ── 대표: 고객 현황 ── */
.srow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center}
.srow .img{width:72px;height:72px;border-radius:12px;background:var(--amber-t) center/contain no-repeat}
.ck{width:3.2rem;height:3.2rem;min-height:0;padding:0;border-radius:12px;background:#fff;border:2px solid var(--line);color:transparent;font-size:1.3rem}
.ck.on{background:var(--green);border-color:var(--green);color:#fff}
.newq{box-shadow:0 0 0 3px var(--red) inset}
.log{font-size:.85rem;color:var(--mute);display:grid;gap:3px;margin-top:6px}
#sync{position:fixed;top:10px;right:10px;background:var(--plum);color:#fff;font-size:.78rem;font-weight:700;border-radius:999px;padding:.3rem .7rem;z-index:9}
.live{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;color:var(--green);font-weight:700}.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
@media (max-width:420px){html{font-size:16px}}
/* 고객 칩 · 취합표 */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rchip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:.35rem .7rem;font-size:.85rem;font-weight:700;background:var(--plum-t);color:var(--plum);border:0;min-height:0;cursor:pointer}
.rchip.done{background:var(--green-t);color:var(--green)}
.rchip .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.mx{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.mx table{border-collapse:collapse;width:100%;font-size:.85rem}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center;white-space:nowrap}
.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:#fff;max-width:9rem;overflow:hidden;text-overflow:ellipsis}
.mx th button{background:none;color:var(--plum);padding:0;min-height:0;font-weight:800;text-decoration:underline}
.setup{max-width:460px;margin:40px auto;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="layer"></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<script>
// 최고집 선택표: 대표님이 사진·순위로 선택표를 만들고 → 고객마다 링크를 보내고 → 고객별 답을 한 화면에서 취합
// 저장은 대표님 구글 시트(Code.gs). 빠른 적용이 우선이라 접속 키 없음
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = n => n === '' || n == null || isNaN(n) ? '' : (+n).toLocaleString() + '만원';
const ago = t => { if (!t) return ''; const s = (Date.now() - t) / 1000; return s < 60 ? '방금' : s < 3600 ? Math.floor(s / 60) + '분 전' : s < 86400 ? Math.floor(s / 3600) + '시간 전' : new Date(t).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' }); };
const uid = () => Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);
function toast(m) { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 2200); }
const shrink = file => new Promise(res => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => {
  const k = Math.min(1, 1000 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k;
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .82)); }; im.src = r.result; }; r.readAsDataURL(file); });
const IC = ['#D9487A', '#4F63D8', '#12968A', '#E07B12', '#8A55C9', '#2B8BD8', '#C7512B', '#B5458F', '#5C7A29'], ic = i => IC[i % IC.length];
const ranked = it => it.opts.map((o, j) => ({ o, j })).sort((a, b) => (a.o.rank || 9) - (b.o.rank || 9));
const label = o => o ? o.name || (o.rank ? `대표님 ${o.rank}순위` : '선택지') : '';
const pickOf = (it, r) => it.opts.find(o => o.id === (r.picks || {})[it.id]);
const qaOf = (r, k) => (r.qa || {})[k] || [];
const newQ = r => Object.values(r.qa || {}).flat().filter(q => q.who === 'c' && q.at > (r.seenAt || 0)).length;
const stat = (b, r) => { const n = b.items.length, p = b.items.filter(it => pickOf(it, r)).length; return { n, p, q: newQ(r), done: n && p === n }; };

// ── 서버 ── 최고집 시트 주소를 넣어 둬서 링크가 짧음 (대표님: 주소만 열기 / 고객: ?c=고객키)
// 시트를 새로 배포해 주소가 바뀌면 이 한 줄만 고치고 깃허브에 다시 올리기
const SERVER = 'https://script.google.com/macros/s/AKfycbwVWBT7GNtVd8ib-34dZXJEwecA-UBWwF_6ytC2-myft60bxEVPBO9-jAxX2zVO6tgi/exec';
const Q = new URLSearchParams(location.search), CID = Q.get('c');
let API_URL = (() => { const s = Q.get('s'); if (s) return `https://script.google.com/macros/s/${s}/exec`; // 예전 긴 링크도 계속 열림
  let a = Q.get('api') || ''; if (CID) return a || SERVER; try { if (a) localStorage.setItem('pick_api', a); else a = localStorage.getItem('pick_api') || ''; } catch {} return a || SERVER; })();
async function gas(fn, ...args) {
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), fn === 'photo' ? 120000 : 40000);
  try { const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }), redirect: 'follow', signal: ac.signal });
    const j = await r.json(); if (!j.ok) { const e = new Error(j.error); e.stop = /링크가 꺼져|no such/.test(j.error); throw e; } return j.data;
  } finally { clearTimeout(tm); }
}
let QQ = Promise.resolve(), pending = 0; // 보내기는 한 줄로 차례차례, 끊기면 다시. 화면은 기다리지 않음
const sleep = ms => new Promise(r => setTimeout(r, ms));
function queue(fn, ...args) {
  pending++; badge();
  QQ = QQ.then(async () => { for (let n = 0; ; n++) { try { return await gas(fn, ...args); } catch (e) { if (e.stop || n >= 5) { toast('저장이 안 됐어요: ' + e.message); return; } badge('연결 확인 중…'); await sleep(3000 * (n + 1)); } } })
    .finally(() => { pending--; badge(); });
  return QQ;
}
function badge(t) { let el = $('#sync'); if (!el) { el = document.createElement('div'); el.id = 'sync'; document.body.append(el); } el.textContent = t || (pending ? '저장 중…' : ''); el.style.display = el.textContent ? '' : 'none'; }
const boardOnly = b => { const c = JSON.parse(JSON.stringify(b)); delete c.recips; return c; };
let saveT = 0;
const saveBoard = (now) => { clearTimeout(saveT); const go = () => queue('saveBoard', boardOnly(cur)); return now ? go() : (saveT = setTimeout(go, 600)); };

let MEM = [], cur = null, curR = null, view = 'home', tab = 'prep';
const recip = () => cur && cur.recips.find(r => r.key === curR);
const allNames = () => [...new Set(MEM.flatMap(b => b.recips.map(r => r.name)))];

// ═════════ 처음 설정 ═════════
function setupScreen(msg) {
  view = 'setup';
  $('#app').innerHTML = `<div class="card setup"><div class="kicker">최고집</div><h1 style="font-size:1.3rem;margin:4px 0 10px">선택표 연결 (처음 한 번)</h1>
    <div class="muted" style="margin-bottom:12px">${esc(msg || '구글 Apps Script 배포 화면의 "웹 앱 URL"을 붙여넣으세요')}</div>
    <input id="api_in" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(API_URL)}">
    <button class="rose" style="width:100%;margin-top:10px" data-a="connect">연결</button></div>`;
  $('#layer').innerHTML = '';
}
async function connect() {
  const t = $('#api_in').value.trim(), m = t.match(/https?:\/\/[^\s?#]+\/exec/);
  if (!m) return toast('…/exec 로 끝나는 주소를 붙여넣어 주세요');
  API_URL = m[0]; try { localStorage.setItem('pick_api', API_URL); } catch {}
  await loadAdmin();
}
async function loadAdmin() {
  $('#app').innerHTML = '<div class="card muted" style="text-align:center;margin-top:40px">불러오는 중…</div>';
  try { MEM = await gas('list'); home(); } catch (e) { setupScreen('연결하지 못했어요: ' + e.message + ' · 배포 액세스가 "모든 사용자"인지 확인해 주세요'); }
}

// ═════════ 대표: 현황 ═════════
function home() {
  view = 'home'; cur = null; curR = null;
  const list = MEM.slice().sort((a, b) => Math.max(b.createdAt || 0, ...b.recips.map(r => r.cAt || r.sentAt || 0)) - Math.max(a.createdAt || 0, ...a.recips.map(r => r.cAt || r.sentAt || 0)));
  $('#app').innerHTML = `
    <div class="top"><div style="flex:1"><div class="kicker">최고집</div><h1>고객 선택 현황</h1></div><button class="rose" data-a="new">＋ 새 선택표</button></div>
    ${list.length ? '' : '<div class="card muted">아직 없어요. ‘＋ 새 선택표’로 시작하세요.</div>'}
    ${list.map(b => { const q = b.recips.reduce((a, r) => a + newQ(r), 0);
      return `<div class="card" data-a="board" data-id="${b.id}" style="cursor:pointer">
        <div style="display:flex;gap:6px;align-items:center"><b style="flex:1;font-size:1.15rem">${esc(b.title) || '(제목 없음)'}</b>${q ? `<span class="badge b-new">새 질문 ${q}</span>` : ''}</div>
        <div class="muted">항목 ${b.items.length}개 · 사진 ${b.items.reduce((a, it) => a + it.opts.length, 0)}장</div>
        ${b.recips.length ? `<div class="chips">${b.recips.map(r => { const s = stat(b, r); return `<button class="rchip ${s.done ? 'done' : ''}" data-a="recip" data-id="${b.id}" data-k="${r.key}">${s.q ? '<span class="dot"></span>' : ''}${esc(r.name)} ${s.done ? '✓' : s.p + '/' + s.n}</button>`; }).join('')}</div>`
          : '<div class="muted" style="margin-top:6px">아직 아무에게도 안 보냄</div>'}
      </div>`; }).join('')}
    ${list.some(b => b.recips.length) ? '<div style="text-align:center"><span class="live">고객이 고르면 20초 안에 바뀌어요</span></div>' : ''}
    <div style="text-align:center;margin-top:30px"><button class="sub sm" data-a="setup">서버 주소 바꾸기</button></div>`;
  $('#layer').innerHTML = '';
}
function newDialog() {
  $('#layer').innerHTML = `<div class="ov"><div class="card">

function create() {
  const b = { id: uid(), title: $('#n_title').value.trim() || '제품 선택', intro: '', items: [blankItem()], createdAt: Date.now(), recips: [] };
  MEM.unshift(b); cur = b; saveBoard(true); openBoard(b.id, 'prep');
}
const blankItem = () => ({ id: uid(), name: '', opts: [] });

// ═════════ 대표: 선택표 ═════════
function openBoard(id, t) { cur = MEM.find(b => b.id === id); if (!cur) return home(); view = 'board'; tab = t || (cur.recips.length ? 'recips' : 'prep'); draw(); scrollTo(0, 0); }
function draw() { view === 'home' ? home() : view === 'recip' ? drawRecip() : tab === 'prep' ? drawPrep() : drawRecips(); }
function boardHead() {
  const q = cur.recips.reduce((a, r) => a + newQ(r), 0);
  return `<div class="top"><button class="sub sm" data-a="home">← 현황</button><div style="flex:1;min-width:0;font-weight:800">${esc(cur.title)}</div></div>
    <div class="tabs"><button class="${tab === 'prep' ? 'on' : ''}" data-a="tab" data-t="prep">① 사진 · 순위</button><button class="${tab === 'recips' ? 'on' : ''}" data-a="tab" data-t="recips">② 보낸 고객 ${cur.recips.length} ${q ? `<span class="badge b-new">${q}</span>` : ''}</button></div>`;
}
function drawPrep() {
  $('#app').innerHTML = boardHead() + `
    <div class="card"><div class="muted">제목</div><input data-f="title" value="${esc(cur.title)}">

    ${cur.items.map((it, i) => `<div class="card" data-item="${i}">
      <div class="ihead"><span class="num" style="background:${ic(i)}">${i + 1}</span><input data-f="name" data-i="${i}" placeholder="고를 것 (예: 변기)" value="${esc(it.name)}" style="font-weight:800;font-size:1.1rem"></div>
      <div class="drop" data-a="add" data-i="${i}"><b>📷 사진 넣기</b>여러 장 한 번에 · 끌어오기 · ⌘V · 사진 주소 붙여넣기<br><small>넣은 순서대로 1·2·3순위가 붙어요</small>

    </div>`).join('')}
    <button class="sub" style="width:100%" data-a="additem">＋ 고를 것 추가</button>
    <div style="text-align:center;margin-top:24px"><button class="sub sm" data-a="delboard">이 선택표 삭제</button></div>`;
  $('#layer').innerHTML = `<div class="bar"><div class="in"><button class="sub" data-a="preview">고객 화면 보기</button><button class="rose" data-a="send">고객에게 보내기</button></div></div>`;

// ② 보낸 고객: 취합표(항목 × 고객) + 고객별 카드
function drawRecips() {
  const R = cur.recips;
  const cell = (it, r) => { const o = pickOf(it, r); return o ? `<span class="${o.rank ? 'rk rk' + o.rank : 'badge b-done'}">${o.rank ? o.rank + '순위' : '선택'}</span>${(r.ordered || {})[it.id] ? ' ✓' : ''}` : '<span class="muted">—</span>'; };
  $('#app').innerHTML = boardHead() + (!R.length ? '<div class="card muted" style="text-align:center">아직 안 보냈어요.<br>아래 ‘고객에게 보내기’에서 <b>고객 이름만</b> 넣으면 그 고객 링크가 생겨요.</div>' : `
    <div class="card"><b>한눈에 취합</b><span class="live" style="float:right">20초마다</span>
      <div class="mx" style="margin-top:8px"><table><tr><th>항목</th>${R.map(r => `<th><button data-a="recip" data-id="${cur.id}" data-k="${r.key}">${esc(r.name)}</button>${newQ(r) ? ' <span class="badge b-new">' + newQ(r) + '</span>' : ''}</th>`).join('')}</tr>
        ${cur.items.map((it, i) => `<tr><td><span class="tagc" style="--ic:${ic(i)}">${esc(it.name) || '(이름 없음)'}</span></td>${R.map(r => `<td>${cell(it, r)}</td>`).join('')}</tr>`).join('')}
        <tr><td><b>진행</b></td>${R.map(r => { const s = stat(cur, r); return `<td><b style="color:${s.done ? 'var(--green)' : 'var(--ink)'}">${s.p}/${s.n}</b></td>`; }).join('')}</tr></table></div></div>
    ${R.map(r => { const s = stat(cur, r), last = (r.log || []).slice(-1)[0]; return `<div class="card" data-a="recip" data-id="${cur.id}" data-k="${r.key}" style="cursor:pointer">
      <div style="display:flex;gap:6px;align-items:center"><b style="flex:1;font-size:1.1rem">${esc(r.name)}</b>${s.q ? `<span class="badge b-new">새 질문 ${s.q}</span>` : ''}<span class="badge ${s.done ? 'b-done' : 'b-wait'}">${s.done ? '다 골랐어요' : s.p ? '고르는 중' : '아직 안 봄'}</span></div>
      <div class="prog"><i style="width:${s.n ? s.p / s.n * 100 : 0}%"></i></div>
      <div class="muted">${s.p}/${s.n} 골랐어요${last ? ` · ${ago(last.at)} ${esc(last.text)}` : ` · ${ago(r.sentAt)} 보냄`}</div></div>`; }).join('')}`);
  $('#layer').innerHTML = `<div class="bar"><div class="in">${R.length ? '<button class="sub" data-a="copyall">취합 복사</button>' : ''}<button class="rose" data-a="send">＋ 고객에게 보내기</button></div></div>`;
}
const linkFor = key => location.origin + location.pathname.replace(/index\.html$/, '') + (API_URL === SERVER ? '?c=' : `?api=${encodeURIComponent(API_URL)}&c=`) + key;
function sendDialog() {
  if (!cur.items.some(it => it.opts.length)) return toast('사진을 한 장 이상 넣어주세요');
  $('#layer').innerHTML = `<div class="ov"><div class="card">
    <h2 style="font-size:1.2rem;margin-bottom:8px">누구에게 보낼까요?</h2>
    <input id="r_name" placeholder="고객 이름 (예: 김종태 선생님)" list="names"><datalist id="names">${allNames().map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div class="muted" style="margin-top:6px">고객마다 따로 링크가 생기고, 답도 따로 모여요</div>
    <div class="grid2" style="margin-top:14px"><button class="sub" data-a="close">취소</button><button class="rose" data-a="mkrecip">링크 만들기</button></div></div></div>`;
  $('#r_name').focus();
}
function mkRecip() {
  const name = $('#r_name').value.trim(); if (!name) return toast('고객 이름을 적어주세요');
  const r = { key: uid().slice(0, 8), name, sentAt: Date.now(), picks: {}, qa: {}, log: [], ordered: {} };
  cur.recips.push(r); saveBoard(true); queue('addRecip', cur.id, r.key, name);
  shareDialog(r);
}
function shareDialog(r) {
  const url = linkFor(r.key), text = `${r.name}, 최고집입니다.\n${cur.title} — 사진 보시고 마음에 드는 걸 눌러주세요. 누르면 바로 저장돼요 👇`;
  $('#layer').innerHTML = `<div class="ov"><div class="card" style="text-align:center">
    <h2 style="font-size:1.2rem">${esc(r.name)} 링크</h2><input readonly value="${esc(url)}" style="margin:10px 0;font-size:.8rem" onclick="this.select()">
    <div style="display:grid;gap:8px">${navigator.share ? '<button class="rose" data-s="share">카톡으로 보내기</button>' : ''}<button class="${navigator.share ? 'sub' : 'rose'}" data-s="copy">링크 복사</button><button class="sub" data-s="open">고객 화면 열어보기</button><button class="sub" data-s="x">닫기</button></div></div></div>`;
  $('#layer').onclick = async e => {
    const s = e.target.closest('[data-s]')?.dataset.s; if (!s) return;
    if (s === 'share') try { await navigator.share({ title: cur.title, text, url }); } catch {}
    if (s === 'copy') { await navigator.clipboard.writeText(text + '\n' + url).then(() => toast('복사했어요. 카톡에 붙여넣으세요'), () => toast('링크 칸을 길게 눌러 복사해 주세요')); return; }
    if (s === 'open') window.open(url, '_blank');
    $('#layer').onclick = null; view = 'board'; tab = 'recips'; draw();
  };
}
function copyAll() {
  const t = cur.recips.map(r => `■ ${r.name}\n` + cur.items.map((it, i) => { const o = pickOf(it, r); return `${i + 1}. ${it.name}: ${o ? [label(o), won(o.price)].filter(Boolean).join(' · ') : '(미선택)'}`; }).join('\n')).join('\n\n');
  navigator.clipboard.writeText(`[${cur.title}] 고객 선택 취합\n\n` + t).then(() => toast('취합을 복사했어요'), () => toast('복사가 안 됐어요'));
}

// ═════════ 대표: 고객 한 명 ═════════
function openRecip(bid, key) {
  cur = MEM.find(b => b.id === bid); if (!cur) return home(); curR = key; const r = recip(); if (!r) return openBoard(bid);
  view = 'recip'; r.seenPrev = r.seenAt || 0; r.seenAt = Date.now(); queue('patchRecip', key, { seenAt: r.seenAt }); draw(); scrollTo(0, 0);
}
function drawRecip() {
  const r = recip(); if (!r) return openBoard(cur.id);
  const s = stat(cur, r), seen = r.seenPrev || 0;
  const total = cur.items.reduce((a, it) => a + (+pickOf(it, r)?.price || 0), 0);
  const thread = (k) => `<div class="qa">${qaOf(r, k).map(q => `<div class="bub ${q.who}"><small>${q.who === 'c' ? '고객' : '대표님'} · ${ago(q.at)}</small>${esc(q.text)}</div>`).join('')}
    <div class="ask"><input data-reply="${k}" placeholder="${qaOf(r, k).length ? '답하기' : '고객에게 먼저 한마디'}"><button class="sm" data-a="reply" data-k="${k}">보내기</button></div></div>`;
  $('#app').innerHTML = `<div class="top"><button class="sub sm" data-a="back">← ${esc(cur.title)}</button></div>
    <div class="card"><div style="display:flex;align-items:center"><b style="flex:1;font-size:1.2rem">${esc(r.name)}</b><span class="live">실시간</span></div>
      <div class="prog"><i style="width:${s.n ? s.p / s.n * 100 : 0}%"></i></div><b>${s.p}/${s.n} 골랐어요</b>
      <div class="log">${(r.log || []).slice(-4).reverse().map(l => `<div>· ${ago(l.at)} ${esc(l.text)}</div>`).join('') || `<div>${ago(r.sentAt)} 보냄 · 아직 안 골랐어요</div>`}</div></div>
    ${cur.items.map((it, i) => { const o = pickOf(it, r), hasNew = qaOf(r, it.id).some(q => q.who === 'c' && q.at > seen);
      return `<div class="card ${hasNew ? 'newq' : ''}"><div class="srow">
        <div class="img" style="${o?.img ? `background-image:url('${o.img}')` : ''}"></div>
        <div><div class="tagc" style="--ic:${ic(i)}">${i + 1}. ${esc(it.name)}</div>${o ? `<div style="font-weight:800">${esc(label(o))}</div><div>${o.rank ? `<span class="rk rk${o.rank}">${o.rank}순위</span> ` : ''}<span class="muted">${won(o.price)}</span></div>` : '<div style="font-weight:700;color:var(--amber)">아직 안 고름</div>'}</div>
        ${o ? `<button class="ck ${(r.ordered || {})[it.id] ? 'on' : ''}" data-a="ord" data-k="${it.id}" title="발주함">✓</button>` : '<span></span>'}</div>
        ${thread(it.id)}</div>`; }).join('')}
    <div class="card"><b>기타 질문</b>${thread('_')}</div>
    <div class="card" style="display:flex;justify-content:space-between;font-weight:800"><span>고른 것 합계</span><span>${won(total) || '0만원'}</span></div>
    <div style="text-align:center"><button class="sub sm" data-a="delrecip">이 고객 빼기</button></div>`;
  $('#layer').innerHTML = `<div class="bar"><div class="in"><button class="sub" data-a="relink">링크 다시 보내기</button><button data-a="copyone">발주 목록 복사</button></div></div>`;
}
function copyOne() {
  const r = recip(), L = cur.items.map((it, i) => { const o = pickOf(it, r); return `${i + 1}. ${it.name}: ${o ? [label(o), won(o.price)].filter(Boolean).join(' · ') : '(미선택)'}`; });
  navigator.clipboard.writeText(`[${r.name}] ${cur.title}\n` + L.join('\n')).then(() => toast('발주 목록을 복사했어요'), () => toast('복사가 안 됐어요'));
}

// ═════════ 사진 ═════════
async function upImg(f) { const d = await shrink(f); return gas('photo', d.split(',')[1], cur.title, 'image/jpeg'); }
const pushOpt = (i, img) => { const it = cur.items[i], used = it.opts.map(o => o.rank), r = [1, 2, 3].find(x => !used.includes(x)) || 0; it.opts.push({ id: uid(), img, name: '', price: '', why: '', rank: r }); };
async function addPhotos(i, files) {
  files = [...files].filter(f => f.type.startsWith('image/')); if (!files.length) return toast('사진 파일만 넣을 수 있어요');
  let n = 0; toast(`사진 올리는 중 0/${files.length}`);
  for (const f of files) { let img; try { img = await upImg(f); } catch (e) { toast('사진을 못 올렸어요: ' + e.message); break; }
    pushOpt(i, img); n++; toast(`사진 올리는 중 ${n}/${files.length}`); }
  if (!n) return; saveBoard(); draw(); toast(`사진 ${n}장 넣었어요`);
}
// 인터넷 사진 주소: 짧게 쓰는 거라 저장하지 않고 주소 그대로 (쇼핑몰이 사진을 지우면 안 보일 수 있음)
const isUrl = t => /^https?:\/\/\S+$/.test(String(t || '').trim());
function addUrls(i, urls) {
  urls = urls.map(u => u.trim()).filter(isUrl); if (!urls.length) return toast('https:// 로 시작하는 사진 주소를 넣어 주세요');
  urls.forEach(u => pushOpt(i, u)); saveBoard(); draw(); toast(`사진 ${urls.length}장 넣었어요`);
}
const urlsFrom = dt => { const l = (dt.getData('text/uri-list') || '').split(/\r?\n/).filter(x => x && x[0] !== '#'), h = (dt.getData('text/html') || '').match(/<img[^>]+src="([^"]+)"/i);
  return h ? [h[1].replace(/&amp;/g, '&')] : l.length ? l : [dt.getData('text/plain')]; };
let fileTarget = null, lastItem = 0;
$('#file').onchange = async e => { const f = e.target.files; if (!f.length || !fileTarget) return;
  if (fileTarget.swap == null) return addPhotos(fileTarget.i, f);
  try { toast('사진 올리는 중…'); cur.items[fileTarget.i].opts[fileTarget.swap][fileTarget.inst ? 'inst' : 'img'] = await upImg(f[0]); saveBoard(); draw(); toast('넣었어요'); } catch (e) { toast('사진을 못 올렸어요: ' + e.message); } };
document.addEventListener('focusin', e => { const c = e.target.closest?.('[data-item]'); if (c) lastItem = +c.dataset.item; });
document.addEventListener('paste', e => { if (view !== 'board' || tab !== 'prep') return; const i = Math.min(lastItem, cur.items.length - 1), f = [...e.clipboardData.files];
  if (f.some(x => x.type.startsWith('image/'))) { e.preventDefault(); return addPhotos(i, f); }
  const t = e.clipboardData.getData('text'); if (isUrl(t) && !document.activeElement?.matches('input,textarea')) { e.preventDefault(); addUrls(i, [t]); } });
document.addEventListener('dragover', e => { e.preventDefault(); document.querySelectorAll('.drop.over').forEach(x => x.classList.remove('over')); e.target.closest?.('.drop')?.classList.add('over'); });
document.addEventListener('drop', e => { e.preventDefault(); const d = e.target.closest?.('[data-item]'); if (!d || view !== 'board') return; document.querySelectorAll('.drop.over').forEach(x => x.classList.remove('over'));
  e.dataTransfer.files.length ? addPhotos(+d.dataset.item, e.dataTransfer.files) : addUrls(+d.dataset.item, urlsFrom(e.dataTransfer)); });
document.addEventListener('input', e => { // 글자 입력: 다시 그리지 않고 값만 저장
  if (view !== 'board' || tab !== 'prep') return; const el = e.target, f = el.dataset.f; if (!f) return;
  const c = el.closest('.eopt'), i = +(c?.dataset.i ?? el.dataset.i);
  if (f === 'title' || f === 'intro') cur[f] = el.value; else if (f === 'name') cur.items[i].name = el.value;
  else { const o = cur.items[i].opts[+c.dataset.o]; if (f === 'oname') o.name = el.value; else if (f === 'price') o.price = el.value.replace(/[^\d.]/g, ''); else o.why = el.value; }
  saveBoard();
});

// ═════════ 고객 화면 ═════════
let CB = null; // {title, intro, items, name, picks, qa}

  const thread = k => `<div class="qa">${qaOf(b, k).map(q => `<div class="bub ${q.who}"><small>${q.who === 'c' ? '나' : '최고집 대표님'} · ${ago(q.at)}</small>${esc(q.text)}</div>`).join('')}
    <div class="ask"><input data-cask="${k}" placeholder="💬 궁금한 점 남기기"><button class="sm" data-a="cask" data-k="${k}">보내기</button></div></div>`;
  $('#app').innerHTML = `
    ${preview ? '<div class="top"><button class="sub sm" data-a="back">← 돌아가기</button><span class="muted">고객이 보는 화면 (미리보기)</span></div>' : ''}
    <div class="c-head"><div class="kicker">최고집</div><h1>${esc(b.title)}</h1><div style="opacity:.85">${esc(b.name)}</div>
      <div style="margin-top:10px;font-size:.95rem">${esc(b.intro) || '대표님이 직접 고른 순서예요.'}<br><b>사진을 누르면 바로 저장</b>되고, 궁금한 건 아래에 남겨주세요.</div>
      <div class="prog"><i style="width:${n ? p / n * 100 : 0}%"></i></div><div style="font-size:.9rem">${p}/${n} 골랐어요</div></div>
    ${p === n && n ? '<div class="done-b">✓ 다 골라주셨어요! 대표님께 바로 전달됐어요.<br><small>바꾸고 싶으면 다른 사진을 누르세요.</small></div>' : ''}
    ${b.items.some(it => it.opts.some(o => o.rank === 1)) && p < n ? '<button class="sub" style="width:100%;margin-bottom:12px" data-a="all1">👍 남은 건 대표님 1순위로 고르기</button>' : ''}
    ${b.items.map((it, i) => { const [first, ...rest] = ranked(it); const dn = !!pickOf(it, b); return `<div class="card ic" style="--ic:${ic(i)}">
      <div class="ib ${dn ? 'done' : ''}"><span class="num">${dn ? '✓' : i + 1}</span><span class="t">${esc(it.name)}</span><span class="st">${dn ? '골랐어요' : '골라주세요'}</span></div>
      ${!first ? '<div class="muted">사진 준비 중이에요</div>' : first.o.rank === 1
        ? `<div class="stack">${card(it, i, first, true)}${rest.length ? `<div class="grid2">${rest.map(x => card(it, i, x)).join('')}</div>` : ''}</div>`
        : `<div class="grid2">${ranked(it).map(x => card(it, i, x)).join('')}</div>`}
      ${thread(it.id)}</div>`; }).join('')}
    <div class="card"><b>그 밖에 궁금한 점</b>${thread('_')}</div>`;
  $('#layer').innerHTML = preview ? '' : `<div class="bar"><div class="in" style="justify-content:center"><span class="live">누르는 순간 저장돼요 · ${p}/${n}</span></div></div>`;
  retryImgs($('#app'));
}
// 드라이브 사진이 막 올라갔거나 잠깐 막히면 3초 뒤 다시 (최대 3번)
function retryImgs(root = document) {
  root.querySelectorAll('[style*="background-image"]').forEach(el => {
    const u = (el.style.backgroundImage.match(/url\(["']?([^"')]+)/) || [])[1]; if (!u || u.startsWith('data:')) return;
    const tryLoad = n => { const im = new Image(); im.onerror = () => n < 3 && setTimeout(() => { const v = u + (u.includes('?') ? '&' : '?') + 'r=' + n; el.style.backgroundImage = `url('${v}')`; tryLoad(n + 1); }, 3000); im.src = u; };
    tryLoad(0);
  });
}
function cRefresh() { const y = scrollY; customer(!CID); scrollTo(0, y); }
function cWrite(mut, msg, op) { // 화면 먼저, 서버엔 그 동작만
  mut(CB); cRefresh(); if (!CID) return toast('미리보기라 저장되지 않아요'); msg && toast(msg);
  queue(...op).then(v => { if (v && !pending) { CB = v; cRefresh(); } });
}

// ═════════ 버튼 ═════════
document.addEventListener('click', e => {
  const c = e.target.closest('[data-ci]');
  if (c) { const it = CB.items[+c.dataset.ci], o = it.opts[+c.dataset.cj], nid = CB.picks[it.id] === o.id ? null : o.id;
    return cWrite(b => { if (nid) b.picks[it.id] = nid; else delete b.picks[it.id]; }, '저장됐어요 ✓', ['cpick', CID, it.id, nid]); }
  const a = e.target.closest('[data-a]'); if (!a) return; const act = a.dataset.a, i = +a.dataset.i, k = a.dataset.k;
  const op = a.closest('.eopt'), oi = op ? +op.dataset.i : i, oj = op ? +op.dataset.o : 0;
  const re = () => { saveBoard(); draw(); };
  const pick = (multi, t) => { fileTarget = t; $('#file').multiple = multi; $('#file').value = ''; $('#file').click(); };
  ({
    setup: () => setupScreen(), connect, new: newDialog, close: () => { $('#layer').innerHTML = ''; draw(); }, create, home,
    board: () => openBoard(a.dataset.id), recip: () => { e.stopPropagation(); openRecip(a.dataset.id, k); },
    tab: () => { tab = a.dataset.t; draw(); scrollTo(0, 0); },
    add: () => pick(true, { i }),
    url: () => { e.stopPropagation(); lastItem = i; const t = prompt('사진 주소를 붙여넣으세요\n(사진에 오른쪽 클릭 → 이미지 주소 복사 · 폰은 사진 길게 눌러 복사)'); if (t) addUrls(i, t.split(/\s+/)); }, swap: () => pick(false, { i: oi, swap: oj }), inst: () => pick(false, { i: oi, swap: oj, inst: true }),
    rank: () => { const os = cur.items[oi].opts, o = os[oj], r = +a.dataset.r; if (o.rank === r) o.rank = 0; else { const other = os.find(x => x.rank === r); if (other) other.rank = o.rank || 0; o.rank = r; } re(); },
    delopt: () => { if (confirm('이 사진을 뺄까요?')) { cur.items[oi].opts.splice(oj, 1); re(); } },
    additem: () => { cur.items.push(blankItem()); re(); setTimeout(() => { scrollTo(0, document.body.scrollHeight); document.querySelector(`[data-item="${cur.items.length - 1}"] input`)?.focus(); }, 0); },
    delitem: () => { if (confirm(`'${cur.items[i].name || i + 1 + '번'}' 항목을 지울까요?`)) { cur.items.splice(i, 1); re(); } },
    up: () => { if (i > 0) { [cur.items[i - 1], cur.items[i]] = [cur.items[i], cur.items[i - 1]]; re(); } },
    dn: () => { if (i < cur.items.length - 1) { [cur.items[i + 1], cur.items[i]] = [cur.items[i], cur.items[i + 1]]; re(); } },
    delboard: () => { if (confirm('이 선택표를 지울까요? 보낸 고객 링크도 모두 열리지 않게 됩니다.')) { MEM = MEM.filter(b => b.id !== cur.id); clearTimeout(saveT); queue('removeBoard', cur.id); home(); } },
    preview: () => { CB = { title: cur.title, intro: cur.intro, items: cur.items, name: '고객 이름', picks: {}, qa: {} }; customer(true); scrollTo(0, 0); },
    back: () => { if (view === 'recip') { view = 'board'; tab = 'recips'; } draw(); scrollTo(0, 0); },
    send: sendDialog, mkrecip: mkRecip, copyall: copyAll, copyone: copyOne, relink: () => shareDialog(recip()),
    delrecip: () => { const r = recip(); if (confirm(`'${r.name}' 고객을 뺄까요? 그 링크는 열리지 않게 됩니다.`)) { cur.recips = cur.recips.filter(x => x !== r); queue('removeRecip', r.key); view = 'board'; tab = 'recips'; draw(); } },
    ord: () => { const r = recip(); r.ordered = r.ordered || {}; const v = !r.ordered[k]; if (v) r.ordered[k] = true; else delete r.ordered[k]; queue('patchRecip', r.key, { ordered: { [k]: v } }); drawRecip(); },
    reply: () => { const inp = document.querySelector(`[data-reply="${k}"]`), t = inp.value.trim(); if (!t) return; const r = recip();
      r.qa = r.qa || {}; (r.qa[k] = r.qa[k] || []).push({ who: 'd', text: t, at: Date.now() }); r.seenAt = r.seenPrev = Date.now();
      queue('reply', r.key, k === '_' ? null : k, t); drawRecip(); toast('보냈어요'); },
    all1: () => cWrite(b => b.items.forEach(it => { if (!b.picks[it.id]) { const one = it.opts.find(o => o.rank === 1); if (one) b.picks[it.id] = one.id; } }), '저장됐어요 ✓', ['call1', CID]),
    cask: () => { const inp = document.querySelector(`[data-cask="${k}"]`), t = inp.value.trim(); if (!t) return;
      cWrite(b => { b.qa = b.qa || {}; (b.qa[k] = b.qa[k] || []).push({ who: 'c', text: t, at: Date.now() }); }, '대표님께 전달됐어요', ['cask', CID, k === '_' ? null : k, t]); },
  })[act]?.();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { if (e.target.matches('[data-cask],[data-reply]')) e.target.nextElementSibling.click(); else if (e.target.id === 'api_in') connect(); else if (e.target.id === 'r_name') mkRecip(); else if (e.target.id === 'n_title') create(); } });

// ═════════ 20초마다 새로 확인 ═════════
const typing = () => { const a = document.activeElement; return a && a.matches('input,textarea') && a.value && !a.readOnly; };
async function poll() {
  if (!API_URL || pending || document.querySelector('.ov') || typing()) return;
  try {
    if (CID) { const v = await gas('cget', CID); if (!pending && !typing()) { CB = v; cRefresh(); } return; }
    if (view === 'setup') return;
    const l = await gas('list'); if (pending || typing()) return;
    const keepSeen = {}; MEM.forEach(b => b.recips.forEach(r => keepSeen[r.key] = r.seenPrev));
    l.forEach(b => b.recips.forEach(r => { if (keepSeen[r.key] != null) r.seenPrev = keepSeen[r.key]; }));
    if (view === 'board' && tab === 'prep' && cur) { const f = l.find(b => b.id === cur.id); if (f) { cur.recips = f.recips; l[l.indexOf(f)] = cur; } MEM = l; return; } // 편집 중인 내용은 그대로
    MEM = l; if (cur) cur = MEM.find(b => b.id === cur.id) || null;
    const y = scrollY; cur || view === 'home' ? draw() : home(); scrollTo(0, y);
  } catch (e) { badge('연결 확인 중…'); setTimeout(() => badge(), 4000); }
}
setInterval(poll, 20000);
setInterval(() => { if (view === 'home' && !document.querySelector('.ov')) home(); }, 60000); // '몇 분 전' 갱신

(async () => {
  if (CID) {
    if (!API_URL) return $('#app').innerHTML = '<div class="card" style="text-align:center;margin-top:40px">링크가 잘못됐어요.<br>대표님께 다시 받아주세요.</div>';
    $('#app').innerHTML = '<div class="card muted" style="text-align:center;margin-top:40px">불러오는 중…</div>';
    try { CB = await gas('cget', CID); customer(false); }
    catch (e) { $('#app').innerHTML = `<div class="card" style="text-align:center;margin-top:40px">${esc(e.message)}<br>대표님께 다시 받아주세요.</div>`; }
  } else if (!API_URL) setupScreen(); else loadAdmin();
})();
</script>
